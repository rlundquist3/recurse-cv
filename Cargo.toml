[package]
name = "recurse-cv"
version = "0.2.0"
edition = "2024"

[dependencies]
byte = "0.2.7"
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
cyw43 = { version = "0.7.0", features = ["defmt"] }
cyw43-pio = { version = "0.10.0", features = ["defmt"] }
defmt = "1.0.1"
defmt-rtt = "1.1.0"
dsp-core = { git = "https://github.com/rlundquist3/synths.git", rev = "89114f1" }
edge-ws = { version = "0.8", default-features = false, features = [
  "defmt",
  "io",
] }
emballoc = "0.3.0"
embassy-executor = { version = "0.10.0", features = [
  "platform-cortex-m",
  "executor-thread",
  "defmt",
] }
embassy-net = { version = "0.9.1", features = [
  "defmt",
  "proto-ipv4",
  "medium-ethernet",
  "tcp",
  "udp",
  "dhcpv4",
  "dns",
] }
embassy-rp = { version = "0.10.0", features = [
  "time-driver",
  "critical-section-impl",
  "rp235xa",
  "binary-info",
  "defmt",
] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1" }
embedded-io-async = "0.7"
embedded-tls = { version = "0.19", default-features = false, features = [
  "defmt",
] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
serde = { version = "1", default-features = false, features = ["derive"] }
serde-json-core = { version = "0.7", features = ["defmt"] }
serial-line-ip = "0.5.0"
static_cell = "2.1.1"

[build-dependencies]
dotenvy = "0.15.7"
